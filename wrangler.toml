# Auctus MCP — Phase 0 scaffold. No deploy scripts; use `wrangler dev` locally.
name = "auctus-mcp-local" # never the production name: a bare `wrangler deploy` must not ship mock mode
main = "src/index.ts"
compatibility_date = "2025-11-14"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[observability]
enabled = true

[observability.logs]
enabled = true

[observability.traces]
enabled = true

# In-memory KV for local dev; replace with real namespaces in Cloudflare before staging.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "00000000000000000000000000000001"
preview_id = "00000000000000000000000000000001"

[[kv_namespaces]]
binding = "MCP_OPS"
id = "00000000000000000000000000000002"
preview_id = "00000000000000000000000000000002"

[vars]
ENVIRONMENT = "local"
MOCK_MODE = "1"
RESOURCE_URL = "http://127.0.0.1:8787/mcp"
ISSUER_URL = "http://127.0.0.1:8787"
WEB_APP_ORIGIN = "http://127.0.0.1:3000"


[[ratelimits]]
name = "RL_READ"
namespace_id = "17891"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "RL_WRITE"
namespace_id = "17892"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_PUBMED"
namespace_id = "17893"
simple = { limit = 30, period = 60 }

# NCBI: 10 req/s per API key, counted per 10 s window.
[[ratelimits]]
name = "RL_NCBI"
namespace_id = "17894"
simple = { limit = 90, period = 10 }

[env.staging]
name = "auctus-mcp-staging"
routes = [
  { pattern = "auth.mcp-staging.auctus.academy", custom_domain = true },
  { pattern = "mcp-staging.auctus.academy", custom_domain = true },
]
vars = { ENVIRONMENT = "staging", MOCK_MODE = "0", RESOURCE_URL = "https://mcp-staging.auctus.academy/mcp", ISSUER_URL = "https://auth.mcp-staging.auctus.academy", WEB_APP_ORIGIN = "https://staging.auctus.academy" }

[[env.staging.kv_namespaces]]
binding = "OAUTH_KV"
id = "0926ed20b4984a6e8eb78bd4000488fc"

[[env.staging.kv_namespaces]]
binding = "MCP_OPS"
id = "f48981df8c13425ba2f71666b1a831b6"

# Read-only use in code: the corpus is read only after mcp.saring_corpus_ref passes as the user.
[[env.staging.r2_buckets]]
binding = "SARING_CORPUS"
bucket_name = "saring-corpus-staging"


[[env.staging.ratelimits]]
name = "RL_READ"
namespace_id = "17881"
simple = { limit = 60, period = 60 }

[[env.staging.ratelimits]]
name = "RL_WRITE"
namespace_id = "17882"
simple = { limit = 10, period = 60 }

[[env.staging.ratelimits]]
name = "RL_PUBMED"
namespace_id = "17883"
simple = { limit = 30, period = 60 }

# NCBI: 10 req/s per API key, counted per 10 s window.
[[env.staging.ratelimits]]
name = "RL_NCBI"
namespace_id = "17884"
simple = { limit = 90, period = 10 }

[env.production]
name = "auctus-mcp-local" # never the production name: a bare `wrangler deploy` must not ship mock mode
vars = { ENVIRONMENT = "production", MOCK_MODE = "0", RESOURCE_URL = "https://mcp.auctus.academy/mcp", ISSUER_URL = "https://auth.mcp.auctus.academy", WEB_APP_ORIGIN = "https://auctus.academy" }

[[env.production.kv_namespaces]]
binding = "OAUTH_KV"
id = "REPLACE_WITH_PROD_OAUTH_KV_ID"

[[env.production.kv_namespaces]]
binding = "MCP_OPS"
id = "REPLACE_WITH_PROD_MCP_OPS_KV_ID"
[[env.production.ratelimits]]
name = "RL_READ"
namespace_id = "17871"
simple = { limit = 60, period = 60 }

[[env.production.ratelimits]]
name = "RL_WRITE"
namespace_id = "17872"
simple = { limit = 10, period = 60 }

[[env.production.ratelimits]]
name = "RL_PUBMED"
namespace_id = "17873"
simple = { limit = 30, period = 60 }

# NCBI: 10 req/s per API key, counted per 10 s window.
[[env.production.ratelimits]]
name = "RL_NCBI"
namespace_id = "17874"
simple = { limit = 90, period = 10 }
